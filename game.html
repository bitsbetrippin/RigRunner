<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rig Runner</title>
<style>
  :root{
    --void:#0d0f14; --panel:#151922; --panelHi:#1e2530; --grid:#222a36;
    --phosphor:#39ff8b; --phosphorDim:#1f7d48;
    --amber:#ffb454; --ember:#ff5d5d; --coin:#ffd24a;
    --text:#e6edf3; --textDim:#8b98a8; --textFaint:#4a5566;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--void);color:var(--text);font-family:var(--mono);-webkit-font-smoothing:antialiased}
  body{max-width:760px;margin:0 auto;padding:0 16px 90px;min-height:100vh}
  button{font-family:var(--mono);cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:var(--phosphorDim);color:var(--void)}
  header{padding:16px 0 8px}
  .brand{color:var(--phosphor);font-size:12px;letter-spacing:4px}
  .ver{color:var(--textFaint);font-size:10px;letter-spacing:1px}
  .hud{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0}
  .hud .coin{color:var(--coin);font-size:24px;font-weight:700}
  .hud .rate{color:var(--phosphorDim);font-size:12px;text-align:right}
  .view{display:none} .view.active{display:block}
  #roomWrap{border:2px solid var(--grid);border-radius:10px;overflow:hidden;background:#070a0e;position:relative;line-height:0}
  #roomImg{width:100%;display:block}
  #rigHot{position:absolute;cursor:pointer;border-radius:6px}
  #rigHot::after{content:'';position:absolute;inset:0;border:2px solid var(--phosphor);border-radius:6px;opacity:.55;animation:pulse 1.9s ease-in-out infinite}
  #rigHot:hover::after{opacity:.95}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(57,255,139,0);opacity:.4}50%{box-shadow:0 0 0 5px rgba(57,255,139,.12);opacity:.95}}
  #rigTag{position:absolute;background:#0d0f14cc;border:1px solid var(--phosphorDim);color:var(--phosphor);
    font-size:10px;letter-spacing:1px;padding:2px 6px;border-radius:4px;pointer-events:none;white-space:nowrap;transform:translateX(-50%)}
  .roomHint{color:var(--textFaint);font-size:11px;text-align:center;margin-top:10px}
  .roomHint b{color:var(--phosphor)}
  .imgErr{display:none;color:var(--ember);font-size:12px;padding:24px;text-align:center;line-height:1.6}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .stat{background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:14px}
  .stat .l{color:var(--textFaint);font-size:9px;letter-spacing:1px;text-transform:uppercase}
  .stat .v{font-size:24px;font-weight:800;margin-top:4px}
  .stat .s{color:var(--textDim);font-size:11px;margin-top:2px}
  .powerBar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin-top:10px}
  .powerFill{height:8px;background:var(--phosphor);border-radius:4px;transition:width .4s}
  .section{color:var(--textDim);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px}
  .backdrop{position:fixed;inset:0;background:#000000cc;display:none;align-items:flex-end;justify-content:center;z-index:100}
  .backdrop.open{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--grid);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:760px;max-height:88vh;overflow:auto;animation:slideUp .18s ease-out}
  @keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheetHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
  .sheetHead h2{font-size:22px;font-weight:800}
  .sheetHead .sub{color:var(--textDim);font-size:12px;margin-top:2px}
  .closeX{color:var(--textFaint);font-size:24px;line-height:1;padding:0 4px}
  .totals{display:flex;gap:8px;margin:16px 0 8px}
  .tcard{flex:1;background:var(--panelHi);border:1px solid var(--grid);border-radius:10px;padding:12px;text-align:center}
  .tcard .v{font-size:20px;font-weight:800}
  .tcard .l{color:var(--textFaint);font-size:9px;letter-spacing:1px;margin-top:3px}
  .cardsLabel{color:var(--textDim);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:16px 0 8px}
  .gpuRow{display:flex;align-items:center;gap:10px;background:var(--panelHi);border:1px solid var(--grid);border-radius:10px;padding:8px 12px;margin-bottom:5px}
  .gpuRow .dot{width:7px;height:7px;border-radius:50%;background:var(--phosphor);flex:none;box-shadow:0 0 6px var(--phosphor)}
  .gpuRow .dot.off{background:var(--textFaint);box-shadow:none}
  .gpuRow .info{flex:1;min-width:0}
  .gpuRow .name{font-size:13px;font-weight:600}
  .gpuRow .meta{color:var(--textDim);font-size:10px;margin-top:1px}
  .gpuRow .rate{color:var(--phosphor);font-size:13px;font-weight:700;text-align:right;flex:none}
  .navBtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .navBtns button{flex:1;min-width:30%;background:var(--phosphorDim);color:var(--void);border-radius:10px;padding:13px;font-weight:800;letter-spacing:1px;font-size:13px}
  .navBtns button.ghost{background:var(--panelHi);color:var(--phosphor);border:1px solid var(--phosphorDim)}
  .navBtns button.power{background:var(--panelHi);border:1px solid var(--grid)}
  .navBtns button.power.on{color:var(--phosphor);border-color:var(--phosphorDim)}
  .navBtns button.power.off{color:var(--ember);border-color:var(--ember)}
  .nodeHead{display:flex;justify-content:space-between;align-items:flex-start;background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:16px;margin-top:10px}
  .nodeHead .moniker{font-size:22px;font-weight:800}
  .nodeHead .addr{color:var(--textFaint);font-size:11px;margin-top:2px}
  .status{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--phosphorDim);color:var(--phosphor);letter-spacing:1px}
  .status.warn{border-color:var(--ember);color:var(--ember)}
  .status.mid{border-color:var(--amber);color:var(--amber)}
  .decayWarn{background:#2a1414;border:1px solid var(--ember);color:var(--ember);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px;display:none}
  .decayWarn.show{display:block}
  .spark{margin-top:8px;background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:12px}
  .spark .l{color:var(--textFaint);font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
  canvas{width:100%;display:block}
  .rigList{margin-top:8px}
  .rigCard{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:12px;margin-bottom:6px}
  .rigCard .info{flex:1}
  .rigCard .nm{font-size:14px;font-weight:600}
  .rigCard .sub{color:var(--textDim);font-size:11px;margin-top:2px}
  .rigCard .st{font-size:10px;letter-spacing:1px;padding:3px 7px;border-radius:999px;border:1px solid var(--grid)}
  .st.MINING{color:var(--phosphor);border-color:var(--phosphorDim)}
  .st.OFFLINE{color:var(--textFaint)}
  .st.STARTUP,.st.STOPPING{color:var(--amber);border-color:var(--amber)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--textFaint);font-size:9px;letter-spacing:1px;text-transform:uppercase;text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid)}
  td{padding:8px;border-bottom:1px solid var(--grid)}
  tr.me td{background:#11251a}
  .vmoniker{font-weight:600}
  .vshare{color:var(--phosphor);font-weight:700}
  .npill{font-size:9px;color:var(--void);background:var(--phosphor);border-radius:4px;padding:1px 4px;margin-left:6px;letter-spacing:1px}
  .blockRow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
  .blockRow:hover{border-color:var(--phosphorDim)}
  .bh{color:var(--coin);font-weight:700;font-size:14px;width:60px;flex:none}
  .binfo{flex:1;min-width:0}
  .binfo .top{font-size:13px}
  .binfo .sub{color:var(--textFaint);font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .breward{color:var(--phosphor);font-size:13px;font-weight:700;flex:none}
  .distRow{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--grid);font-size:13px}
  .note{color:var(--textFaint);font-size:10px;line-height:1.5;margin-top:16px;border-top:1px solid var(--grid);padding-top:12px}
  .note b{color:var(--amber)}
  .tabs{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--grid);display:flex;justify-content:center;gap:8px;padding:6px 8px 10px;z-index:50}
  .tabs button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--textFaint);font-size:10px;letter-spacing:1px;padding:6px 0;border-radius:8px}
  .tabs button.active{color:var(--phosphor)}
  .tabs .ic{font-size:18px}

  /* mining console */
  #console{position:fixed;inset:0;z-index:200;background:#020402;display:none;flex-direction:column}
  #console.open{display:flex}
  .crtBar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0a120a;border-bottom:1px solid #15301a;flex:none}
  .crtBar .ttl{color:#39ff8b;font-size:12px;letter-spacing:2px}
  .crtBar .x{color:#2f7d48;font-size:22px;line-height:1;cursor:pointer;padding:0 6px}
  .crtBar .x:hover{color:#39ff8b}
  .crtScreen{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#04140a 0%,#020802 100%)}
  .crtScreen::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,0) 4px)}
  .crtScreen::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 120px rgba(0,0,0,.7), inset 0 0 30px rgba(0,40,0,.4)}
  #crtLog{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;z-index:2;font-family:var(--mono);font-size:12.5px;line-height:1.5;text-shadow:0 0 4px currentColor;white-space:pre-wrap;word-break:break-word}
  .c-eth{color:#39ff8b} .c-gpu{color:#d96bff} .c-job{color:#9ad8ff}
  .c-share{color:#fff36b;font-weight:700} .c-ok{color:#39ff8b;font-weight:700}
  .c-dim{color:#2f7d48} .c-warn{color:#ffb454}
  .crtFoot{flex:none;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 14px;background:#0a120a;border-top:1px solid #15301a;color:#2f7d48;font-size:11px}
  .crtFoot b{color:#39ff8b}
  .crtBtn{background:#0a120a;border:1px solid #2f7d48;color:#39ff8b;border-radius:6px;padding:6px 12px;font-size:11px;letter-spacing:1px;cursor:pointer}
  .crtBtn:hover{background:#10240f}
  .crtCursor{display:inline-block;width:8px;height:14px;background:#39ff8b;animation:blink 1s steps(1) infinite;vertical-align:middle}
  @keyframes blink{50%{opacity:0}}
  .emptyScreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;color:#1c3a24;font-size:13px;letter-spacing:2px}
</style>
</head>
<body>
<header>
  <div class="brand">RIG RUNNER &middot; DORM 1 <span class="ver">v0.3</span></div>
  <div class="hud">
    <span class="coin" id="hudCoin">&#9923; 0 BBT</span>
    <span class="rate" id="hudRate">0 H/s</span>
  </div>
</header>

<div class="view active" id="view-room">
  <div id="roomWrap">
    <img id="roomImg" src="assets/room.png" alt="Dorm room" />
    <div id="rigHot" title="Mining rig"></div>
    <div id="rigTag">RIG 01 &middot; tap for stats</div>
    <div class="imgErr" id="imgErr">Couldn&rsquo;t load <b>room.png</b>. Keep all files together (see README).</div>
  </div>
  <div class="roomHint">Tap the <b>mining rig</b> to view stats, your node, and the network.</div>
</div>
<div class="view" id="view-dash"></div>
<div class="view" id="view-explore"></div>
<div class="view" id="view-stats"></div>
<div class="view" id="view-settings"></div>

<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>

<div id="console">
  <div class="crtBar">
    <span class="ttl" id="crtTitle">MINING CONSOLE</span>
    <span class="x" id="crtClose">&times;</span>
  </div>
  <div class="crtScreen">
    <div class="emptyScreen" id="crtEmpty">— SCREEN OFF —</div>
    <div id="crtLog"></div>
  </div>
  <div class="crtFoot">
    <span id="crtStatus">&hellip;</span>
    <button class="crtBtn" id="crtPower">POWER</button>
  </div>
</div>

<div class="tabs">
  <button class="active" data-tab="room"><span class="ic">&#127968;</span>ROOM</button>
  <button data-tab="dash"><span class="ic">&#128225;</span>MY NODE</button>
  <button data-tab="explore"><span class="ic">&#129513;</span>EXPLORER</button>
  <button data-tab="stats"><span class="ic">&#128202;</span>STATS</button>
  <button data-tab="settings"><span class="ic">&#9881;</span>SETTINGS</button>
</div>

<script src="engine/chain.js"></script>
<script src="engine/power.js"></script>
<script>
/* =========================================================================
   Rig Runner v0.1 — integrated build
   Token: BBT. Each rig is an independent object with its own state machine
   (OFFLINE / STARTUP / MINING / STOPPING) and hashrate. The sum of all online
   rigs feeds the player validator, registering cumulatively on the network.
   ========================================================================= */

/* ---- GPU + rig definitions ---- */
/* GPU hashrate in MH/s (real-world scale: ~28 MH/s per RX 6800-class card in 2015-16).
   A 6-card rig ~168 MH/s = ~0.044% of the 381 GH/s global network. */
const GPU_CATALOG={ rx6800:{ name:'AMD RX 6800', mhPerCard:28, watts:230 } };

/* Rig factory: each rig is independent. Add more rigs to RIGS[] later. */
function makeRig(id,label,gpu,count){
  return { id,label,gpu,count,
    state:'OFFLINE',          // OFFLINE | STARTUP | MINING | STOPPING
    power:'normal',           // low | normal | high  (sets watts + hash)
    shares:0, jobId:1 };
}
const RIGS=[ makeRig('rig1','Rig 01 \u00B7 Desk','rx6800',6) ];

function rigGpu(r){ return GPU_CATALOG[r.gpu]; }
function rigFullHash(r){ return rigPowerHash(r, rigGpu(r).mhPerCard); } // power-scaled MH/s
function rigLiveHash(r){ return r.state==='MINING' ? rigFullHash(r) : 0; } // contributes only while mining
function networkHashFromRigs(){ return RIGS.reduce((s,r)=>s+rigLiveHash(r),0); }
function rigDrawW(r){ return r.state==='OFFLINE' ? 0 : rigWatts(r); }       // watts when on
function totalDrawW(){ return RIGS.reduce((s,r)=>s+rigDrawW(r),0); }
function totalBtu(){ return wattsToBtu(totalDrawW()); }

/* ---- persistence: rig states + chain + settings/economy ---- */
const KEY='rigrunner:integrated:v0_3';
let APP;
(function init(){
  let loaded=null;
  try{ const raw=localStorage.getItem(KEY); if(raw) loaded=JSON.parse(raw); }catch(e){}
  if(loaded && loaded.chain && loaded.chain.network && loaded.rigs){
    APP=loaded;
    RIGS.forEach(r=>{ const sv=APP.rigs.find(x=>x.id===r.id); if(sv){ r.state=sv.state; r.power=sv.power||'normal'; r.shares=sv.shares||0; r.jobId=sv.jobId||1; } });
    setPlayerHashRate(APP.chain, networkHashFromRigs());
    // restore pool/solo selection
    if(APP.settings){ if(APP.settings.poolId) setPool(APP.chain, APP.settings.poolId); else setRewardMode(APP.chain,'solo'); }
    const lastSync=APP.econ.lastSyncMs||Date.now();
    const elapsedSec=Math.min((Date.now()-lastSync)/1000, 86400);
    if(elapsedSec>0) APP.econ.kwhUsed += kwh(totalDrawW(), elapsedSec/3600);
    syncToTime(APP.chain, Date.now());
    APP.econ.lastSyncMs=Date.now();
  } else {
    RIGS[0].state='MINING';
    const chain=createNetwork(networkHashFromRigs());
    setRewardMode(chain,'solo');
    syncToTime(chain, Date.now());
    APP={ chain,
      settings:{ costPerKwh:ECON_DEFAULTS.costPerKwh, rewardMode:'solo', poolId:null },
      econ:{ bbtUsd:ECON_DEFAULTS.bbtUsd, kwhUsed:0, billStartAt:Date.now(), lastSyncMs:Date.now() } };
  }
  // defensive defaults
  if(!APP.settings) APP.settings={ costPerKwh:ECON_DEFAULTS.costPerKwh, rewardMode:'solo', poolId:null };
  if(APP.settings.poolId===undefined) APP.settings.poolId=null;
  if(!APP.econ) APP.econ={ bbtUsd:ECON_DEFAULTS.bbtUsd, kwhUsed:0, billStartAt:Date.now(), lastSyncMs:Date.now() };
  if(APP.econ.lastSyncMs===undefined) APP.econ.lastSyncMs=Date.now();
  syncRigsToApp(); save();
})();
function syncRigsToApp(){ APP.rigs=RIGS.map(r=>({id:r.id,state:r.state,power:r.power,shares:r.shares,jobId:r.jobId})); }
function save(){ syncRigsToApp(); try{ localStorage.setItem(KEY, JSON.stringify(APP)); }catch(e){} }
const SRC=makeMockSource(()=>APP.chain);

/* ---- live tick: render-rate-independent; chain advances by WALL-CLOCK TIME ---- */
let shareHistory=[], priceHistory=[];
function playerGlobalShare(){ const net=SRC.getNetwork(); const p=SRC.getPlayer(); return net.globalHashRate>0 ? p.hashRate/net.globalHashRate : 0; }
function tick(){
  const now=Date.now();
  setPlayerHashRate(APP.chain, networkHashFromRigs());

  // accrue power + price by REAL elapsed time since last sync (not per-tick constant)
  const elapsedSec=Math.max(0,(now-(APP.econ.lastSyncMs||now))/1000);
  if(elapsedSec>0){
    APP.econ.kwhUsed += kwh(totalDrawW(), elapsedSec/3600);
    const steps=Math.max(1,Math.round(elapsedSec/2));
    for(let i=0;i<steps && i<10;i++) APP.econ.bbtUsd=driftPrice(APP.econ.bbtUsd, Math.random());
  }
  APP.econ.lastSyncMs=now;

  syncToTime(APP.chain, now);

  priceHistory.push(APP.econ.bbtUsd); if(priceHistory.length>60) priceHistory.shift();
  shareHistory.push(playerGlobalShare());
  if(shareHistory.length>60) shareHistory.shift();
  save(); render();
}
setInterval(tick, 1000); // render once a second; chain cadence is time-driven, not tick-driven

/* ---- helpers ---- */
const fmt=n=>Math.round(n).toLocaleString();
const fmt1=n=>n.toFixed(1);
const pct=n=>(n*100).toFixed(1)+'%';
const shortAddr=id=>'rigvaloper1'+id.replace(/[^a-z0-9]/gi,'').slice(0,8).toLowerCase()+'\u2026q'+(id.length*7%97);
const ago=ms=>{const s=Math.floor((Date.now()-ms)/1000); if(s<60)return s+'s ago'; return Math.floor(s/60)+'m ago';};

/* ---- room hotspot ---- */
const hot=document.getElementById('rigHot'), tag=document.getElementById('rigTag'), img=document.getElementById('roomImg');
const RIG_PCT={ left:57.5, top:58.5, width:23.0, height:14.5 };
function placeHot(){
  hot.style.left=RIG_PCT.left+'%'; hot.style.top=RIG_PCT.top+'%';
  hot.style.width=RIG_PCT.width+'%'; hot.style.height=RIG_PCT.height+'%';
  tag.style.left=(RIG_PCT.left+RIG_PCT.width/2)+'%'; tag.style.top=(RIG_PCT.top-4)+'%';
}
img.addEventListener('load', placeHot);
img.addEventListener('error', function(){ document.getElementById('imgErr').style.display='block'; img.style.display='none'; hot.style.display='none'; tag.style.display='none'; });
if(img.complete && img.naturalWidth) placeHot();
hot.addEventListener('click', ()=>openRigStats(RIGS[0]));

/* ---- rig quick-stats sheet ---- */
const backdrop=document.getElementById('backdrop'), sheet=document.getElementById('sheet');
let activeRig=RIGS[0];
function openRigStats(rig){
  activeRig=rig;
  const gpu=rigGpu(rig); const full=rigFullHash(rig);
  const p=SRC.getPlayer(), net=SRC.getNetwork();
  const share=net.globalHashRate>0 ? rigLiveHash(rig)/net.globalHashRate : 0;
  const mining = rig.state==='MINING';
  const perCardMh=rigPowerHash(rig, gpu.mhPerCard)/rig.count;
  let rows='';
  for(let i=0;i<rig.count;i++){
    rows+='<div class="gpuRow"><span class="dot '+(mining?'':'off')+'"></span><div class="info">'+
      '<div class="name">'+gpu.name+' <span style="color:var(--textFaint)">\u00B7 slot '+(i+1)+'</span></div>'+
      '<div class="meta">'+gpu.watts+' W \u00B7 '+rig.state+'</div></div>'+
      '<div class="rate">'+(mining?perCardMh.toFixed(0):0)+' MH/s</div></div>';
  }
  const watts=rigDrawW(rig)||rigWatts(rig);
  const btu=Math.round(wattsToBtu(watts));
  // pool selector options
  const pools=SRC.getPools();
  let poolOpts='<option value="solo"'+(APP.settings.poolId?'':' selected')+'>\u26A1 Solo (winner-take-all)</option>';
  pools.forEach(pl=>{ poolOpts+='<option value="'+pl.id+'"'+(APP.settings.poolId===pl.id?' selected':'')+'>'+pl.name+' \u00B7 '+(pl.fee*100).toFixed(1)+'% fee \u00B7 '+(pl.globalShare*100).toFixed(1)+'% net</option>'; });
  const curPool=APP.settings.poolId?poolById(APP.chain,APP.settings.poolId):null;
  const poolLine=curPool? curPool.name+' \u00B7 '+curPool.host+':'+curPool.port+' \u00B7 '+(curPool.fee*100).toFixed(1)+'% fee'
                        : 'Solo mining \u00B7 you vs. the whole network';
  sheet.innerHTML='<div class="sheetHead"><div><h2>'+rig.label+'</h2>'+

/* ---- RIG STATE MACHINE ----
   OFFLINE --start--> STARTUP --(boot done)--> MINING --stop--> STOPPING --(done)--> OFFLINE */
function toggleRig(rig){
  if(rig.state==='OFFLINE'){ startRig(rig); }
  else if(rig.state==='MINING'){ stopRig(rig); }
  // ignore taps mid-transition (STARTUP/STOPPING)
}
function startRig(rig){
  rig.state='STARTUP'; rig.shares=0; rig.jobId=1; save(); render();
  // boot takes a few seconds; if a console is open it shows the sequence,
  // otherwise we still transition to MINING on a timer.
  rig._bootDone=false;
  if(!(consoleRig===rig && consoleEl.classList.contains('open'))){
    setTimeout(()=>{ if(rig.state==='STARTUP'){ rig.state='MINING'; save(); render(); } }, 4000);
  }
}
function stopRig(rig){
  rig.state='STOPPING'; save(); render();
  if(!(consoleRig===rig && consoleEl.classList.contains('open'))){
    setTimeout(()=>{ if(rig.state==='STOPPING'){ rig.state='OFFLINE'; save(); render(); } }, 2500);
  }
}

/* ---- MINING CONSOLE (per-rig, state-aware, infinite scroll) ---- */
const consoleEl=document.getElementById('console');
const crtLog=document.getElementById('crtLog');
const crtStatus=document.getElementById('crtStatus');
const crtEmpty=document.getElementById('crtEmpty');
const crtTitle=document.getElementById('crtTitle');
const crtPower=document.getElementById('crtPower');
let consoleTimer=null, consoleRig=null;
const MAX_LINES=200;
let logLines=[]; // ring buffer of {html,cls}

function mhPerCard(rig){ const b=rigGpu(rig).mhPerCard; return b+(Math.random()*2-1); }
function nowClock(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}/${p(d.getDate())}/${String(d.getFullYear()).slice(2)}-${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

function renderLog(){
  crtLog.innerHTML = logLines.map(l=>'<div class="ln '+(l.cls||'')+'">'+l.html+'</div>').join('');
}
function pushLine(html, cls){
  logLines.push({html,cls});
  // RING BUFFER: drop oldest, never clear/restart — seamless loop past MAX_LINES
  if(logLines.length>MAX_LINES) logLines.shift();
  renderLog();
}

function openConsole(rig){
  consoleRig=rig;
  consoleEl.classList.add('open');
  crtTitle.textContent=rig.label.toUpperCase()+' \u00B7 MINING CONSOLE';
  logLines=[]; renderLog();
  refreshConsoleForState(rig, true);
}
function closeConsole(){
  consoleEl.classList.remove('open');
  if(consoleTimer){ clearTimeout(consoleTimer); consoleTimer=null; }
  consoleRig=null;
}
document.getElementById('crtClose').onclick=closeConsole;
crtPower.onclick=()=>{ if(consoleRig) toggleRig(consoleRig); refreshConsoleForState(consoleRig, true); };

/* Show the right console behavior for the rig's current state. */
function refreshConsoleForState(rig, justOpened){
  if(consoleTimer){ clearTimeout(consoleTimer); consoleTimer=null; }
  crtPower.textContent = (rig.state==='MINING'||rig.state==='STARTUP') ? 'STOP' : 'POWER ON';
  if(rig.state==='OFFLINE'){
    crtEmpty.style.display='flex'; crtEmpty.textContent='— SCREEN OFF —';
    crtStatus.textContent='offline';
    return;
  }
  crtEmpty.style.display='none';
  if(rig.state==='STARTUP'){ bootSequence(rig); }
  else if(rig.state==='STOPPING'){ stopSequence(rig); }
  else if(rig.state==='MINING'){
    crtStatus.innerHTML='MINING <span class="crtCursor"></span>';
    // if opened fresh into an already-mining rig, seed a little context (no DAG replay)
    if(justOpened && logLines.length===0){
      pushLine('ETH: Resuming session \u2014 '+rig.count+' GPUs online', 'c-ok');
    }
    loopMining(rig);
  }
}

function bootSequence(rig){
  const gpu=rigGpu(rig);
  crtStatus.textContent='initializing\u2026';
  const steps=[
    ['RIG RUNNER miner v0.9.2 \u2014 '+rig.count+'x '+gpu.name, 'c-ok', 250],
    ['Loading OpenCL platform AMD Accelerated Parallel Processing\u2026', 'c-dim', 350],
    ...Array.from({length:rig.count},(_,i)=>['Detected GPU'+i+': '+gpu.name+'  '+gpu.watts+'W  16GB', 'c-eth', 150]),
    ['Connecting to pool us2.rigrunner-pool:4444 \u2026', 'c-job', 380],
    ['Authorized. Subscribed to mining.notify', 'c-ok', 280],
    ...Array.from({length:rig.count},(_,i)=>['Building DAG for GPU'+i+' \u2026 epoch 482', 'c-dim', 200]),
    ['DAG generation complete ('+rig.count+' GPUs) \u2014 '+(3*rig.count)+'.0 GB', 'c-ok', 320],
    ['ETH: Mining started. target '+(rigGpu(rig).mhPerCard*rig.count).toFixed(1)+' Mh/s ('+fmt(rigFullHash(rig))+' MH/s)', 'c-eth', 300],
  ];
  let i=0;
  (function next(){
    if(consoleRig!==rig || rig.state!=='STARTUP'){ return; }
    if(i>=steps.length){
      rig.state='MINING'; save(); render();
      crtStatus.innerHTML='MINING <span class="crtCursor"></span>';
      crtPower.textContent='STOP';
      loopMining(rig); return;
    }
    const [txt,cls,delay]=steps[i++];
    pushLine(txt,cls);
    consoleTimer=setTimeout(next, delay);
  })();
}

function stopSequence(rig){
  crtStatus.textContent='stopping\u2026';
  crtPower.textContent='POWER ON';
  const steps=[
    ['ETH: Stopping mining \u2014 flushing work\u2026', 'c-warn', 400],
    ...Array.from({length:rig.count},(_,i)=>['GPU'+i+' halted, fan spindown', 'c-gpu', 180]),
    ['ETH: Disconnected from pool us2.rigrunner-pool:4444', 'c-dim', 350],
    ['ETH: Miner stopped. '+rig.shares+' shares this session.', 'c-warn', 300],
  ];
  let i=0;
  (function next(){
    if(consoleRig!==rig || rig.state!=='STOPPING'){ return; }
    if(i>=steps.length){
      rig.state='OFFLINE'; save(); render();
      crtEmpty.style.display='flex'; crtEmpty.textContent='— SCREEN OFF —';
      crtStatus.textContent='offline';
      return;
    }
    const [txt,cls,delay]=steps[i++];
    pushLine(txt,cls);
    consoleTimer=setTimeout(next, delay);
  })();
}

function loopMining(rig){
  if(consoleRig!==rig || rig.state!=='MINING'){ return; }
  const roll=Math.random();
  if(roll<0.30){
    const per=Array.from({length:rig.count},()=>mhPerCard(rig));
    const tot=per.reduce((a,b)=>a+b,0);
    pushLine('ETH: Total Speed: '+tot.toFixed(3)+' Mh/s, Shares: '+rig.shares+', Rejected: 0 \u00B7 '+fmt(rigFullHash(rig))+' MH/s', 'c-eth');
    let line='ETH: '; per.forEach((m,i)=>{ line+='GPU'+i+' '+m.toFixed(3)+' Mh/s'+(i<rig.count-1?', ':''); });
    pushLine(line,'c-eth');
  } else if(roll<0.50){
    let line=''; for(let i=0;i<rig.count;i++){ const t=50+Math.floor(Math.random()*22); const fan=20+Math.floor(Math.random()*55);
      line+='GPU'+i+' t='+t+'C fan='+fan+'%'+(i<rig.count-1?', ':''); }
    pushLine(line,'c-gpu');
  } else if(roll<0.72){
    pushLine('ETH: '+nowClock()+' \u2014 New job #'+(rig.jobId++).toString(16)+' from us2.rigrunner-pool:4444', 'c-job');
  } else if(roll<0.90){
    const g=Math.floor(Math.random()*rig.count);
    pushLine('ETH: '+nowClock()+' \u2014 SHARE FOUND \u2014 (GPU '+g+')', 'c-share');
    const ms=20+Math.floor(Math.random()*60); rig.shares++;
    consoleTimer=setTimeout(()=>{ if(consoleRig===rig&&rig.state==='MINING') pushLine('ETH: Share accepted ('+ms+' ms)!', 'c-ok'); continueLoop(rig); }, 150);
    return;
  } else {
    pushLine('ETH: Pool set difficulty to '+(4+Math.floor(Math.random()*8))+'.00 G', 'c-dim');
  }
  continueLoop(rig);
}
function continueLoop(rig){
  const p=SRC.getPlayer();
  crtStatus.innerHTML='MINING '+fmt(networkHashFromRigs())+' MH/s \u00B7 '+rig.shares+' shares \u00B7 bal '+fmt1(p.balance)+' BBT <span class="crtCursor"></span>';
  consoleTimer=setTimeout(()=>loopMining(rig), 350+Math.random()*500);
}

function drawSpark(){
  const c=document.getElementById('shareSpark'); if(!c) return;
  const w=c.clientWidth; c.width=w; const h=c.height; const x=c.getContext('2d'); x.clearRect(0,0,w,h);
  if(shareHistory.length<2) return;
  const max=Math.max(...shareHistory), min=Math.min(...shareHistory); const rg=(max-min)||1; const step=w/(shareHistory.length-1);
  x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--phosphor').trim(); x.lineWidth=2; x.beginPath();
  shareHistory.forEach((s,i)=>{ const px=i*step, py=h-6-((s-min)/rg)*(h-12); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke();
}

    <div class="grid2">
      <div class="stat"><div class="l">Total Heat</div><div class="v" style="color:var(--amber)">${fmt(totalBtu())}<span style="font-size:12px;color:var(--textDim)"> BTU/hr</span></div><div class="s">${fmt(watts)} W \u2192 heat</div></div>
      <div class="stat"><div class="l">Room Temp</div><div class="v" style="color:${room>90?'var(--ember)':'var(--amber)'}">${room}\u00B0F</div><div class="s">base 72\u00B0F \u00B7 ${ROOM_HUMIDITY}% RH</div></div>
    </div>
    <div class="section">30-day power bill</div>
    <div class="stat"><div class="l">Accrued This Cycle</div>
      <div class="v" style="color:var(--ember)">${money(APP.econ.kwhUsed*APP.settings.costPerKwh)}</div>
      <div class="s">${APP.econ.kwhUsed.toFixed(1)} kWh @ $${APP.settings.costPerKwh}/kWh \u00B7 due after 30 days</div></div>
    <div class="note">Anchored to late-2015 Ethereum scale: a 6-card rig is ~0.044% of a ~381 GH/s network.
      Luck = actual vs. expected block wins. Token: <b>BBT</b>.</div>`;
}

/* ---- settings ---- */
function renderSettings(){
  const s=APP.settings;
  const inPool=!!s.poolId; const pool=inPool?poolById(APP.chain,s.poolId):null;
  document.getElementById('view-settings').innerHTML=`
    <header style="padding:6px 0 0"><h2 style="font-size:30px;font-weight:800">Settings</h2></header>
    <div class="section">Current mining target</div>
    <div class="stat"><div class="l">${inPool?'Pool':'Solo'}</div>
      <div class="v" style="color:var(--phosphor);font-size:18px">${inPool?pool.name:'Solo mining'}</div>
      <div class="s">${inPool?pool.host+':'+pool.port+' \u00B7 '+(pool.fee*100).toFixed(1)+'% fee':'winner-take-all \u00B7 no fees \u00B7 high variance'}</div></div>
    <div class="note" style="margin-top:8px;border:none;padding-top:4px">Change your pool or switch to solo from any rig\u2019s settings (tap the rig \u2192 Mining target).</div>
    <div class="section">Electricity cost</div>
    <div class="stat"><div class="l">Cost per kWh</div>
      <div class="v" style="color:var(--coin)">$<span id="kwhVal">${s.costPerKwh.toFixed(2)}</span></div>
      <input type="range" id="kwhRange" min="0.02" max="0.40" step="0.01" value="${s.costPerKwh}" style="width:100%;margin-top:10px;accent-color:var(--phosphor)">
      <div class="s">drag to set your power rate</div></div>
    <div class="section">Reset</div>
    <div id="resetBtn" style="background:var(--panelHi);color:var(--ember);border:1px solid var(--ember);border-radius:10px;padding:13px;text-align:center;cursor:pointer">Reset all progress</div>
    <div class="note">Room baseline fixed at 72\u00B0F / 25% RH. Weather-by-zip via API is on the backlog.</div>`;
  const range=document.getElementById('kwhRange');
  range.oninput=()=>{ s.costPerKwh=parseFloat(range.value); document.getElementById('kwhVal').textContent=s.costPerKwh.toFixed(2); save(); };
  document.getElementById('resetBtn').onclick=()=>{ if(confirm('Reset all progress? This wipes your save.')){ localStorage.removeItem(KEY); location.reload(); } };
}

/* ---- nav + master render ---- */
let activeTab='room';
function go(tab){
  activeTab=tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  render();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
if(location.hash==='#explore') go('explore');
else if(location.hash==='#dash') go('dash');
function render(){
  const net=SRC.getNetwork(); const p=SRC.getPlayer();
  document.getElementById('hudCoin').textContent='\u26C3 '+fmt(p.balance)+' BBT';
  const gShare=net.globalHashRate>0?p.hashRate/net.globalHashRate:0;
  document.getElementById('hudRate').textContent=fmt(networkHashFromRigs())+' MH/s \u00B7 '+(gShare*100).toFixed(4)+'% net';
  if(activeTab==='dash') renderDash();
  else if(activeTab==='explore') renderExplore();
  else if(activeTab==='stats') renderStats();
  else if(activeTab==='settings') renderSettings();
}
render();
</script>
</body>
</html>
